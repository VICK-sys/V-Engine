name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test managed build
        run: dotnet test VEngine.sln --artifacts-path artifacts/managed-tests -p:VEngineNativeDirectory=missing --verbosity minimal
      - name: Build native runtime and packages
        shell: pwsh
        run: ./Tools/package.ps1
      - name: Verify package consumers
        shell: pwsh
        run: ./Tools/verify-package.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: VEngine-win-x64
          path: artifacts/packages/*
          if-no-files-found: error
